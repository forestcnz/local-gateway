# 推送 master 时自动构建多平台二进制并创建 GitHub Release
name: Release

on:
  push:
    branches: [release]

# 创建 Release 需要 GITHUB_TOKEN 的写权限
permissions:
  contents: write

# 同一分支新推送会取消进行中的旧构建，避免重复发布
concurrency:
  group: release-master
  cancel-in-progress: true

jobs:
  # 先跑测试，测试不过不发布
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 测试
        run: cargo test

  build:
    needs: test
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64（Intel/AMD 芯片）
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: .exe
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            ext: .exe
          # macOS Apple Silicon（M 系列芯片）
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ""
          # macOS Intel 芯片
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            ext: ""
          # Linux x64（Debian/Ubuntu），额外打包 .deb 安装包
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            ext: ""
            deb: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash
      # 从 Cargo.toml 读取版本号，供产物命名使用
      - name: 读取版本号
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = \"//;s/\"//')" >> "$GITHUB_ENV"
      # 产物命名为 local-gateway-v<版本>-<平台>[.exe]
      - name: 重命名产物
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/local-gateway${{ matrix.ext }}" \
             "dist/local-gateway-v${{ env.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}"
      # 仅 Linux x64 目标额外打包 Debian(.deb) 安装包
      - name: 打包 Debian 安装包
        if: matrix.deb
        shell: bash
        run: |
          set -e
          # 在临时目录内组装 .deb 包目录结构
          PKG_ROOT="$RUNNER_TEMP/local-gateway-pkg"
          mkdir -p "$PKG_ROOT/usr/bin" "$PKG_ROOT/DEBIAN"
          cp "target/${{ matrix.target }}/release/local-gateway" "$PKG_ROOT/usr/bin/local-gateway"
          # 生成 Debian control 文件，版本号取自 Cargo.toml
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: local-gateway
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Local Gateway Developers
          Description: AI Model API Gateway (OpenAI / Anthropic / Responses)
          EOF
          # 用 dpkg-deb 产出 .deb，放入 dist 随 Release 一起发布
          dpkg-deb --build "$PKG_ROOT" "dist/local-gateway_${VERSION}_amd64.deb"
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # tag 形如 v0.1.0-<短SHA>，每次推送唯一，版本号取自 Cargo.toml
      - name: 计算 tag
        id: tag
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | sed 's/version = \"//;s/\"//')-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: local-gateway ${{ steps.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true
